# Single public entrypoint (port 80). Routes API / WebSocket / admin / static /
# media to the Django (Daphne) container and everything else to Next.js.
# One origin for the whole app → no CORS, and the served IP/host is never
# baked into the web build.

upstream ft_api { server api:8000; }
upstream ft_web { server web:3000; }

server {
    listen 80 default_server;
    server_name _;

    # Task proof photos can be a few MB.
    client_max_body_size 12M;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Django (Daphne) ─────────────────────────────────────────────────────
    location /api/    { proxy_pass http://ft_api; }
    location /admin/  { proxy_pass http://ft_api; }
    location /static/ { proxy_pass http://ft_api; }
    location /media/  { proxy_pass http://ft_api; }

    # WebSocket (Channels) — needs the HTTP/1.1 upgrade dance + long timeout.
    location /ws/ {
        proxy_pass http://ft_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Next.js dashboard (everything else, incl. /_next/ assets) ───────────
    location / {
        proxy_pass http://ft_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
