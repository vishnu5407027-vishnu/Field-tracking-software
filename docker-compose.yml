services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: fieldtracking
      POSTGRES_PASSWORD: fieldtracking
      POSTGRES_DB: fieldtracking
    # Host port 5433 to avoid clashing with a locally installed PostgreSQL.
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldtracking -d fieldtracking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://fieldtracking:fieldtracking@db:5432/fieldtracking
      REDIS_URL: redis://redis:6379
      SECRET_KEY: dev-only-secret-change-in-production
      JWT_SECRET: dev-only-secret-change-in-production
      DEBUG: "0"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # The browser calls the API on the host, so these stay localhost:8000.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws/live
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
